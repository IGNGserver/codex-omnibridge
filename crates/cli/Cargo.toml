[package]
name = "codex-mp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "codex-mp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
codex-mp-catalog = { path = "../catalog" }
codex-mp-core = { path = "../core" }
codex-mp-credentials = { path = "../credentials" }
codex-mp-desktop = { path = "../desktop" }
codex-mp-integration = { path = "../integration" }
codex-mp-manager = { path = "../manager" }
codex-mp-router = { path = "../router" }
codex-mp-web = { path = "../web" }
open.workspace = true
reqwest.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

secrecy.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
