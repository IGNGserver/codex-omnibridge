<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Codex OmniBridge">
  <!--
    Brand mark for the panel. Colours come from the dark-scheme tokens in
    apps/panel/tokens.css (surface #0b1516, primary #00daf2, tertiary #b2c7f3)
    so the icon matches the product surface instead of carrying its own
    unrelated palette. The squircle radius follows the M3 Expressive
    extra-large-increased step.
  -->
  <rect width="64" height="64" rx="20" fill="#0b1516" />

  <!-- One hub bridging three providers: what the tool actually does. -->
  <g stroke="#00daf2" stroke-width="2.5" stroke-linecap="round">
    <path d="M32 26 L18 16" />
    <path d="M32 26 L46 16" />
    <path d="M32 26 L32 44" />
  </g>
  <circle cx="32" cy="26" r="6.5" fill="#00daf2" />
  <circle cx="18" cy="15" r="4" fill="#b2c7f3" />
  <circle cx="46" cy="15" r="4" fill="#b2c7f3" />
  <circle cx="32" cy="46" r="5" fill="#b2c7f3" />
</svg>
