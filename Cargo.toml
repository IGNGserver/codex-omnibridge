[workspace]
members = [
    "crates/core",
    "crates/credentials",
    "crates/catalog",
    "crates/router",
    "crates/integration",
    "crates/manager",
    "crates/desktop",
    "crates/protocol-bridge",
    "crates/web",
    "crates/cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.2"
authors = ["Codex MultiProvider contributors"]

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
async-trait = "0.1"
async-stream = "0.3"
base64 = "0.22"
axum = { version = "0.8", features = ["macros"] }
brotli = "8.0"
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6.0"
flate2 = "1.1"
http = "1.3"
keyring = "4.2"
log = "0.4"
# Listed directly only to switch on `getrandom`, which is what re-exports
# `OsRng` from `password_hash::rand_core`. `argon2`'s `rand` feature turns on
# `password-hash/rand_core` but *not* `password-hash/getrandom`, so the
# re-export stays configured out unless something in the graph asks for it.
password-hash = { version = "0.5", features = ["getrandom", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
toml = "0.9"
toml_edit = "0.22"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.26", features = ["v4"] }
libc = "0.2"
zstd = "0.13"
rust-embed = { version = "8.5", features = ["interpolate-folder-path"] }
open = "5.3"
ksni = { version = "0.3", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
