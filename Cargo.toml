[workspace]
members = [
    "crates/core",
    "crates/credentials",
    "crates/catalog",
    "crates/router",
    "crates/integration",
    "crates/manager",
    "crates/desktop",
    "crates/cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["Codex MultiProvider contributors"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6.0"
http = "1.3"
keyring = "4.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
toml = "0.9"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.26", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
