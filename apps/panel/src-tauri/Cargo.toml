[package]
name = "codex-mp-panel"
version = "0.1.0"
description = "Codex MultiProvider management panel"
authors = ["Codex MultiProvider contributors"]
edition = "2024"

[workspace]

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
codex-mp-core = { path = "../../../crates/core" }
codex-mp-integration = { path = "../../../crates/integration" }
codex-mp-manager = { path = "../../../crates/manager" }
codex-mp-router = { path = "../../../crates/router" }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = ["tray-icon"] }
tokio = { version = "1.48", features = ["sync"] }
