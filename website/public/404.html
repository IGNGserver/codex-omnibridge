<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>页面未找到 · Codex OmniBridge</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <style>
      :root {
        --bg: #f6feff;
        --card: #ffffff;
        --ink: #151d1e;
        --muted: #374a4d;
        --primary: #006874;
        --on-primary: #ffffff;
        --outline: #b4cace;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1516;
          --card: #131d1f;
          --ink: #d9e4e6;
          --muted: #b0c0c3;
          --primary: #00daf2;
          --on-primary: #002d33;
          --outline: #38494c;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      }

      .card {
        max-width: 480px;
        padding: 32px;
        border-radius: 28px;
        background: var(--card);
        border: 1px solid var(--outline);
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }

      p {
        margin: 0 0 22px;
        font-size: 14.5px;
        line-height: 1.65;
        color: var(--muted);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 22px;
        border-radius: 999px;
        background: var(--primary);
        color: var(--on-primary);
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>找不到这个页面</h1>
      <p>你访问的链接可能已调整或不存在。欢迎回到 Codex OmniBridge 首页查看最新安装包与使用演示。</p>
      <a class="btn" href="./">返回首页</a>
    </main>
  </body>
</html>
