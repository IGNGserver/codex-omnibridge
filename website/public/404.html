<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#030a0c" />
    <title>404 光路未命中 — Codex OmniBridge</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      @font-face {
        font-family: 'Roboto Flex';
        src: url('/fonts/roboto-flex-latin.woff2') format('woff2');
        font-weight: 100 1000;
        font-display: swap;
      }
      @font-face {
        font-family: 'Noto Sans SC';
        src: url('/fonts/noto-sans-sc.woff2') format('woff2');
        font-weight: 300 700;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(60% 50% at 50% 35%, rgba(0, 218, 242, 0.12), transparent 70%),
          #030a0c;
        color: #dff4f8;
        font-family: 'Roboto Flex', 'Noto Sans SC', system-ui, sans-serif;
      }
      .card {
        max-width: 540px;
        width: 100%;
        padding: 40px 36px;
        border-radius: 28px;
        background: rgba(8, 22, 27, 0.86);
        border: 1px solid rgba(0, 218, 242, 0.24);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.6);
        text-align: center;
      }
      .kicker {
        display: inline-block;
        padding: 5px 12px;
        border-radius: 999px;
        background: rgba(0, 218, 242, 0.1);
        border: 1px solid rgba(0, 218, 242, 0.28);
        color: #62ecff;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
      }
      h1 {
        margin: 18px 0 12px;
        font-size: clamp(2rem, 5vw, 3rem);
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 28px;
        color: #8fb4be;
        line-height: 1.65;
        font-size: 15px;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        border-radius: 999px;
        background: linear-gradient(135deg, #00daf2, #00a6b8);
        color: #002025;
        font-weight: 700;
        font-size: 14px;
        text-decoration: none;
        transition: transform 180ms ease, box-shadow 180ms ease;
      }
      a.btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 28px rgba(0, 218, 242, 0.32);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="kicker">HTTP 404 // OPTICAL ROUTE UNMAPPED</span>
      <h1>404 · 请求光路未登记</h1>
      <p>
        当前访问的路径不在 Codex OmniBridge 光学目录合成器（Catalog Synthesizer）路由表内。请返回主控制台检视实时交换矩阵。
      </p>
      <a class="btn" href="/">返回 Codex OmniBridge 首页</a>
    </main>
  </body>
</html>
