name: Website

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  push:
    branches: ['main']
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # PRs build the pull-request head; pushes and repository_dispatch build main.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Build (TypeScript check + Vite bundle)
        run: pnpm run build
        env:
          SITE_URL: https://omnibridge.igng.net/

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('website/pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: End-to-end & WebGL verification
        run: pnpm run verify

      - name: Check Cloudflare credentials
        id: cf_creds
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 未配置于仓库 Secrets，跳过 CI 自动推送（可通过授权 Cloudflare API Direct Upload 部署；配置两个 Secrets 后自动启用推送直发）。"
          fi

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && steps.cf_creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: pages deploy dist --project-name omnibridge-website --branch main
