name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如 v0.1.0-alpha.1)'
        required: true
        default: 'v0.1.0-alpha.1'
      is_prerelease:
        description: '是否标记为预发布 (Pre-release)？默认勾选，明确要求正式版时才取消'
        type: boolean
        required: true
        default: true
      release_notes:
        description: '本次更新内容说明 (中文)'
        required: true
        default: '### 🚀 更新内容\n- 初始预览版本发布\n- 支持多提供商添加与模型抓取\n- 支持无感保留官方订阅与同 Thread 自由切模型'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target.os }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: linux-x86_64
            runner: ubuntu-24.04
            artifact_name: codex-omnibridge-linux-x86_64.tar.gz
          - os: windows-x86_64
            runner: windows-latest
            artifact_name: codex-omnibridge-windows-x86_64.zip
          - os: macos-x86_64
            runner: macos-13
            artifact_name: codex-omnibridge-macos-x86_64.tar.gz
          - os: macos-aarch64
            runner: macos-14
            artifact_name: codex-omnibridge-macos-aarch64.tar.gz

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 系统依赖 (GTK / WebKit / AppIndicator)
        if: matrix.target.runner == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: 编译核心程序 (CLI / Router)
        run: |
          cargo build --release --locked --package codex-mp-cli

      - name: 打包 Linux 产物
        if: matrix.target.runner == 'ubuntu-24.04'
        run: |
          mkdir -p dist/package
          cp target/release/codex-mp dist/package/
          cp installer/install-linux.sh dist/package/
          cp installer/uninstall-linux.sh dist/package/
          cp README.md LICENSE dist/package/
          tar -czf ${{ matrix.target.artifact_name }} -C dist/package .

      - name: 打包 Windows 产物
        if: matrix.target.runner == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package
          Copy-Item target/release/codex-mp.exe dist/package/
          Copy-Item README.md, LICENSE dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath ${{ matrix.target.artifact_name }}

      - name: 打包 macOS 产物
        if: startsWith(matrix.target.runner, 'macos')
        run: |
          mkdir -p dist/package
          cp target/release/codex-mp dist/package/
          cp README.md LICENSE dist/package/
          tar -czf ${{ matrix.target.artifact_name }} -C dist/package .

      - name: 上传构建构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.os }}
          path: ${{ matrix.target.artifact_name }}

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: 整理发布附件
        run: |
          mkdir -p assets
          find release-artifacts -type f -name "*.*" -exec cp {} assets/ \;
          ls -la assets/

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.release_notes }}
          prerelease: ${{ github.event.inputs.is_prerelease }}
          files: assets/*
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
